<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>데이터 확인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: rgba(255, 255, 255, 0.08);
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --ok: #3fb950;
      --err: #f85149;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    header {
      margin-bottom: 1.25rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    header p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      padding: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 1rem;
    }

    .toolbar-phase {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-right: auto;
    }

    .toolbar .status {
      flex: 1;
      min-width: 8rem;
      font-size: 0.85rem;
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-left: auto;
    }

    .phase-btn.active {
      background: rgba(88, 166, 255, 0.28);
      border-color: var(--accent);
      color: var(--text);
    }

    .btn {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(88, 166, 255, 0.12);
      color: var(--accent);
      cursor: pointer;
    }

    .btn:hover:not(:disabled) {
      background: rgba(88, 166, 255, 0.22);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #0d1117;
      border-color: transparent;
    }

    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    .btn-danger {
      background: rgba(248, 81, 73, 0.15);
      color: var(--err);
      border-color: rgba(248, 81, 73, 0.35);
    }

    .btn-danger:hover:not(:disabled) {
      background: rgba(248, 81, 73, 0.28);
    }

    .table-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .table-actions .selection-info {
      font-size: 0.85rem;
      color: var(--muted);
      margin-left: 0.25rem;
    }

    .category-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 0.65rem;
    }

    .category-btn {
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .category-btn:hover {
      color: var(--text);
      border-color: rgba(88, 166, 255, 0.35);
    }

    .category-btn.active {
      background: rgba(88, 166, 255, 0.2);
      border-color: var(--accent);
      color: var(--accent);
    }

    input[type="file"].file-input-hidden {
      position: absolute;
      width: 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.55);
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.15rem;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .modal-close {
      font-family: inherit;
      font-size: 1.25rem;
      line-height: 1;
      padding: 0.2rem 0.45rem;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .modal-close:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    .modal-body {
      padding: 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .modal-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: flex-end;
      padding: 0 1.15rem 1.15rem;
    }

    .modal-status {
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 1.25rem;
    }

    .modal-status.ok { color: var(--ok); }
    .modal-status.error { color: var(--err); }
    .modal-status.info { color: var(--accent); }

    .drop-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 1.5rem 1rem;
      border: 2px dashed var(--border);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.15);
      color: var(--muted);
      font-size: 0.88rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .drop-zone:hover {
      border-color: rgba(88, 166, 255, 0.4);
      background: rgba(88, 166, 255, 0.06);
    }

    .drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(88, 166, 255, 0.12);
      color: var(--text);
    }

    .drop-zone strong {
      color: var(--accent);
      font-weight: 600;
    }

    .drop-zone .file-name {
      color: var(--text);
      font-size: 0.85rem;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    label.check {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--muted);
      cursor: pointer;
    }

    .status {
      font-size: 0.85rem;
      color: var(--muted);
      margin-left: auto;
      min-width: 120px;
      text-align: right;
    }

    .status-ok { color: var(--ok); }
    .status-error { color: var(--err); }
    .status-info { color: var(--accent); }

    .data-filters {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 0.65rem 1rem;
      margin-bottom: 0.65rem;
      padding: 0.85rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .data-filters label {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .data-filters select,
    .data-filters input[type="search"],
    .data-filters input[type="date"] {
      font-family: inherit;
      font-size: 0.85rem;
      min-width: 120px;
      padding: 0.4rem 0.55rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }

    .data-filters .date-range {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .data-filters .date-field {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .data-filters .date-range input[type="date"] {
      min-width: 10.5rem;
      padding-right: 2.25rem;
      cursor: pointer;
      color-scheme: dark;
    }

    .data-filters .date-range input[type="date"]::-webkit-calendar-picker-indicator {
      opacity: 0;
      position: absolute;
      right: 0;
      width: 2.25rem;
      height: 100%;
      cursor: pointer;
    }

    .data-filters .btn-calendar {
      position: absolute;
      right: 0.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1.75rem;
      height: 1.75rem;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
    }

    .data-filters .btn-calendar:hover {
      background: rgba(88, 166, 255, 0.15);
    }

    .data-filters .btn-calendar svg {
      width: 1.1rem;
      height: 1.1rem;
      pointer-events: none;
    }

    .data-filters .date-range-sep {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .data-filters input[type="search"] {
      min-width: 200px;
    }

    .filter-result-count {
      font-size: 0.85rem;
      color: var(--muted);
      margin-left: auto;
      align-self: center;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      max-height: calc(100vh - 220px);
    }

    table.data-table {
      width: 100%;
      max-width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    th, td {
      padding: 0.5rem 0.65rem;
      border-bottom: 1px solid var(--border);
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: top;
    }

    th {
      position: sticky;
      top: 0;
      background: #243044;
      font-weight: 600;
      z-index: 1;
      user-select: none;
    }

    th .th-label {
      display: flex;
      align-items: center;
      gap: 0.2rem;
      padding-right: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    th.sortable {
      cursor: pointer;
    }

    th.sortable:hover {
      background: #2a3a52;
    }

    th.sortable .sort-indicator {
      flex-shrink: 0;
      font-size: 0.7rem;
      color: var(--accent);
      min-width: 0.85rem;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    td.num { color: var(--muted); }

    th.col-check,
    td.col-check {
      width: 36px;
      text-align: center;
      padding-left: 0.35rem;
      padding-right: 0.35rem;
    }

    td.col-check input {
      cursor: pointer;
      width: 1rem;
      height: 1rem;
    }

    td.tag-cell .tag-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
    }

    td.tag-cell .tag-badge,
    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      max-width: 100%;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      background: rgba(88, 166, 255, 0.2);
      color: var(--accent);
      font-size: 0.78rem;
      vertical-align: middle;
    }

    .tag-chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      min-height: 2.5rem;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.12);
    }

    .tag-chip-list.empty-hint {
      color: var(--muted);
      font-size: 0.85rem;
      align-items: center;
    }

    .tag-chip button {
      font-family: inherit;
      font-size: 1rem;
      line-height: 1;
      padding: 0 0.2rem;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .tag-chip button:hover {
      color: var(--err);
    }

    .tag-add-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .tag-add-row input {
      flex: 1;
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.45rem 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }

    .tag-modal-info {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    td.tag-cell .tag-empty {
      color: var(--muted);
    }

    td.date-cell {
      font-variant-numeric: tabular-nums;
    }

    tr.row-selected td {
      background: rgba(88, 166, 255, 0.08);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 2rem !important;
      white-space: normal;
    }

    .hint {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: rgba(88, 166, 255, 0.08);
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .hint code {
      color: var(--accent);
      font-size: 0.78rem;
    }

    td.cell-title {
      padding: 0;
    }

    .btn-title-link {
      display: block;
      width: 100%;
      text-align: left;
      font-family: inherit;
      font-size: inherit;
      padding: 0.5rem 0.65rem;
      border: none;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-title-link:hover {
      text-decoration: underline;
    }

    td.cell-platform {
      padding: 0;
    }

    .btn-platform-link {
      display: block;
      width: 100%;
      text-align: left;
      font-family: inherit;
      font-size: inherit;
      padding: 0.5rem 0.65rem;
      border: none;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-platform-link:hover {
      text-decoration: underline;
    }

    td.cell-author {
      padding: 0;
    }

    .btn-author-link {
      display: block;
      width: 100%;
      text-align: left;
      font-family: inherit;
      font-size: inherit;
      padding: 0.5rem 0.65rem;
      border: none;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-author-link:hover {
      text-decoration: underline;
    }

    .author-modal-name {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 0 0 0.35rem;
      word-break: break-word;
    }

    .author-modal-platform {
      font-size: 0.9rem;
      color: var(--muted);
      margin: 0 0 0.35rem;
    }

    .author-modal-hint {
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0 0 1rem;
    }

    .author-modal-actions {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .author-modal-actions .btn {
      width: 100%;
      justify-content: center;
    }

    .btn-list-black {
      background: rgba(220, 80, 80, 0.2);
      border-color: rgba(220, 80, 80, 0.55);
      color: #f5b0b0;
    }

    .btn-list-black:hover:not(:disabled) {
      border-color: #e07070;
      color: #fff;
    }

    .btn-list-white {
      background: rgba(80, 180, 120, 0.2);
      border-color: rgba(80, 180, 120, 0.55);
      color: #b8f0d0;
    }

    .btn-list-white:hover:not(:disabled) {
      border-color: #70c090;
      color: #fff;
    }

    .btn-list-ignore {
      background: rgba(140, 140, 150, 0.2);
      border-color: rgba(140, 140, 150, 0.55);
      color: #c8c8d0;
    }

    .btn-list-ignore:hover:not(:disabled) {
      border-color: #9898a8;
      color: #fff;
    }

    .btn-list-reset {
      background: transparent;
      border-color: var(--border);
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .btn-list-reset:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--text);
    }

    .btn-detail-author {
      width: 100%;
      text-align: left;
      font-family: inherit;
      font-size: inherit;
      cursor: pointer;
      color: var(--accent);
    }

    .btn-detail-author:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .btn-detail-author.is-empty {
      cursor: default;
      color: inherit;
      pointer-events: none;
    }

    .detail-modal-backdrop {
      padding: 1rem 3rem;
    }

    .detail-modal-backdrop.open {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .detail-nav {
      flex-shrink: 0;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
    }

    .detail-nav:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .detail-nav:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .modal.detail-modal {
      flex: 1;
      max-width: 920px;
      max-height: calc(100vh - 2rem);
      display: flex;
      flex-direction: column;
    }

    .detail-modal .modal-header {
      flex-shrink: 0;
    }

    .detail-modal-main {
      display: flex;
      gap: 1rem;
      padding: 1rem 1.15rem;
      overflow: auto;
      flex: 1;
      min-height: 0;
    }

    .detail-image-panel {
      flex: 0 0 42%;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-width: 0;
    }

    .detail-image-row {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex: 1;
      min-height: 0;
    }

    .detail-url-block {
      flex-shrink: 0;
      min-height: 1.25rem;
    }

    .detail-url-link {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.78rem;
      line-height: 1.4;
      max-height: calc(0.78rem * 1.4 * 2);
      color: var(--accent);
      overflow-wrap: anywhere;
      text-decoration: none;
    }

    .detail-url-link:hover {
      text-decoration: underline;
    }

    .detail-url-empty {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .detail-image-wrap {
      flex: 1;
      aspect-ratio: 1;
      max-height: 360px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .detail-image-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .detail-image-wrap .image-empty {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .img-nav {
      flex-shrink: 0;
      width: 2rem;
      height: 2rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
    }

    .img-nav:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .img-nav:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .detail-fields {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-width: 0;
      min-height: 0;
    }

    .detail-title-box {
      flex: 1 1 auto;
      min-height: 10rem;
      max-height: 12rem;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.15);
      font-weight: 600;
      font-size: 0.95rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      overflow: auto;
    }

    .detail-meta-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.75fr);
      gap: 0.5rem;
      align-items: end;
      flex-shrink: 0;
    }

    .detail-meta-row .detail-field-block {
      min-width: 0;
    }

    .detail-meta-row .detail-readonly {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail-memo-block {
      flex-shrink: 0;
    }

    .detail-field-block label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }

    .detail-readonly {
      padding: 0.45rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.12);
      font-size: 0.85rem;
      min-height: 2rem;
    }

    .detail-fields input,
    .detail-fields textarea {
      font-family: inherit;
      font-size: 0.85rem;
      padding: 0.45rem 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      width: 100%;
    }

    .detail-fields textarea {
      min-height: 2.5rem;
      resize: vertical;
    }

    .detail-categories {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem;
      padding: 0.75rem 1.15rem;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .detail-categories .category-btn {
      margin: 0;
    }

    .btn-report {
      background: rgba(210, 153, 34, 0.18);
      color: #e3b341;
      border-color: rgba(210, 153, 34, 0.45);
      flex-shrink: 0;
    }

    .btn-report:hover:not(:disabled) {
      background: rgba(210, 153, 34, 0.32);
      color: #fff;
    }

    .table-actions .btn-report[hidden] {
      display: none;
    }

    .category-bulk-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.5rem;
    }

    .category-bulk-info {
      font-size: 0.88rem;
      color: var(--muted);
      margin: 0;
    }

    .upload-result-summary {
      font-size: 0.88rem;
      color: var(--muted);
      margin: 0 0 0.75rem;
    }

    .upload-result-category-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .upload-result-category-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.45rem 0.65rem;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.2);
      font-size: 0.9rem;
    }

    .upload-result-category-list .count {
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      font-weight: 600;
    }

    .detail-modal .modal-footer {
      flex-shrink: 0;
    }

    .modal.data-view-modal {
      max-width: min(96vw, 1200px);
      max-height: calc(100vh - 2rem);
      display: flex;
      flex-direction: column;
    }

    .data-view-hint {
      font-size: 0.82rem;
      color: var(--muted);
      margin: 0 0 0.65rem;
    }

    .data-view-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.65rem;
    }

    .data-view-scroll {
      overflow: auto;
      flex: 1;
      min-height: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.15);
    }

    .data-view-table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      user-select: text;
    }

    .data-view-table th,
    .data-view-table td {
      border: 1px solid var(--border);
      padding: 0.35rem 0.5rem;
      text-align: left;
      vertical-align: top;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 280px;
    }

    .data-view-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #243044;
      font-weight: 600;
      vertical-align: bottom;
    }

    .data-view-table th .data-view-col-check-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 0.3rem;
    }

    .data-view-table th .data-view-col-check {
      width: 1rem;
      height: 1rem;
      cursor: pointer;
      accent-color: var(--accent);
    }

    .data-view-table th .data-view-col-name {
      display: block;
      white-space: nowrap;
      font-weight: 600;
    }

    .data-view-table tbody tr:nth-child(even) td {
      background: rgba(255, 255, 255, 0.02);
    }

    .data-view-table tbody tr:hover td {
      background: rgba(88, 166, 255, 0.08);
    }

    .data-view-table .num {
      text-align: right;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>데이터 확인</h1>
    </header>

    <div class="toolbar">
      <div class="toolbar-phase">
        <button type="button" class="btn phase-btn active" id="btnPhaseClassification">분류 단계</button>
        <button type="button" class="btn phase-btn" id="btnPhaseReport">신고 단계</button>
      </div>
      <span class="status" id="status">준비</span>
      <div class="toolbar-actions">
        <button type="button" class="btn" id="btnRefresh">새로고침</button>
        <button type="button" class="btn btn-primary" id="btnAddData">데이터 추가</button>
      </div>
    </div>

    <div class="category-filters" id="categoryFilters" aria-label="분류 필터"></div>

    <div class="data-filters">
      <label>
        플랫폼
        <select id="filterCol1">
          <option value="">전체</option>
        </select>
      </label>
      <label>
        태그
        <select id="filterTag">
          <option value="">전체</option>
        </select>
      </label>
      <label>
        수집일
        <span class="date-range">
          <span class="date-field">
            <input type="date" id="filterCol2From" aria-label="수집일 시작" />
            <button type="button" class="btn-calendar" data-date-for="filterCol2From" aria-label="시작일 달력">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <path d="M16 2v4M8 2v4M3 10h18" />
              </svg>
            </button>
          </span>
          <span class="date-range-sep">~</span>
          <span class="date-field">
            <input type="date" id="filterCol2To" aria-label="수집일 종료" />
            <button type="button" class="btn-calendar" data-date-for="filterCol2To" aria-label="종료일 달력">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <path d="M16 2v4M8 2v4M3 10h18" />
              </svg>
            </button>
          </span>
        </span>
      </label>
      <label>
        검색
        <input type="search" id="searchInput" placeholder="표시 열에서 검색" autocomplete="off" />
      </label>
      <button type="button" class="btn" id="btnClearFilters">초기화</button>
      <span class="filter-result-count" id="filterResultCount"></span>
    </div>

    <div class="table-actions">
      <button type="button" class="btn btn-danger" id="btnDelete" disabled>삭제</button>
      <button type="button" class="btn" id="btnTagAdd" disabled>태그</button>
      <button type="button" class="btn" id="btnCategoryBulk" disabled>분류</button>
      <button type="button" class="btn btn-report" id="btnReportSubmit" disabled hidden>신고하기</button>
      <button type="button" class="btn" id="btnDataView" disabled>데이터 보기</button>
      <span class="selection-info" id="selectionInfo">0건 선택</span>
    </div>

    <div class="table-wrap">
      <table class="data-table" id="dataTable">
        <colgroup id="colgroup"></colgroup>
        <thead>
          <tr id="headerRow"></tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="7" class="empty">불러오는 중…</td></tr>
        </tbody>
      </table>
    </div>

    <p class="hint">
      <strong>데이터 추가</strong>로 엑셀 업로드 · A~J열(1~10) · 1행 헤더 건너뜀
    </p>
  </div>

  <div class="modal-backdrop detail-modal-backdrop" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="detailModalTitle">
    <button type="button" class="detail-nav" id="detailNavPrev" aria-label="이전 데이터">‹</button>
    <div class="modal detail-modal">
      <div class="modal-header">
        <h2 id="detailModalTitle">상세</h2>
        <button type="button" class="modal-close" id="btnDetailClose" aria-label="닫기">&times;</button>
      </div>
      <div class="detail-modal-main">
        <div class="detail-image-panel">
          <div class="detail-image-row">
            <button type="button" class="img-nav" id="detailImgPrev" aria-label="이전 이미지">‹</button>
            <div class="detail-image-wrap">
              <img id="detailImage" alt="" hidden />
              <span class="image-empty" id="detailImageEmpty">이미지 없음</span>
            </div>
            <button type="button" class="img-nav" id="detailImgNext" aria-label="다음 이미지">›</button>
          </div>
          <div class="detail-url-block">
            <a id="detailUrlLink" class="detail-url-link" href="#" target="_blank" rel="noopener noreferrer" hidden></a>
            <span class="detail-url-empty" id="detailUrlEmpty">URL 없음</span>
          </div>
        </div>
        <div class="detail-fields">
          <div class="detail-title-box" id="detailTitle"></div>
          <div class="detail-meta-row">
            <div class="detail-field-block">
              <label>작성자</label>
              <button type="button" class="detail-readonly btn-detail-author is-empty" id="detailAuthor">
                —
              </button>
            </div>
            <div class="detail-field-block">
              <label>수집일</label>
              <div class="detail-readonly" id="detailDate"></div>
            </div>
            <div class="detail-field-block">
              <label for="detailTag" title="쉼표로 구분">태그</label>
              <input type="text" id="detailTag" autocomplete="off" placeholder="쉼표로 구분" />
            </div>
          </div>
          <div class="detail-field-block detail-memo-block">
            <label for="detailMemo">메모</label>
            <textarea id="detailMemo" rows="2"></textarea>
          </div>
        </div>
      </div>
      <div class="detail-categories" id="detailCategories" aria-label="분류"></div>
      <p class="modal-status" id="detailModalStatus" style="padding: 0 1.15rem 0.5rem"></p>
      <div class="modal-footer">
        <button type="button" class="btn" id="btnDetailCancel">취소</button>
        <button type="button" class="btn btn-primary" id="btnDetailSave">완료</button>
      </div>
    </div>
    <button type="button" class="detail-nav" id="detailNavNext" aria-label="다음 데이터">›</button>
  </div>

  <div class="modal-backdrop" id="authorModal" role="dialog" aria-modal="true" aria-labelledby="authorModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h2 id="authorModalTitle">작성자 관리</h2>
        <button type="button" class="modal-close" id="btnAuthorModalClose" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body">
        <p class="author-modal-name" id="authorModalName"></p>
        <p class="author-modal-platform" id="authorModalPlatform"></p>
        <p class="author-modal-hint">동일 플랫폼·작성자의 데이터 분류만 변경됩니다.</p>
        <div class="author-modal-actions">
          <button type="button" class="btn btn-list-black" id="btnAuthorBlacklist">
            블랙리스트 넣기
          </button>
          <button type="button" class="btn btn-list-white" id="btnAuthorWhitelist">
            화이트리스트 넣기
          </button>
          <button type="button" class="btn btn-list-ignore" id="btnAuthorIgnore">무시</button>
          <button type="button" class="btn btn-list-reset" id="btnAuthorReset">초기화</button>
        </div>
        <p class="modal-status" id="authorModalStatus"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" id="btnAuthorModalCancel">닫기</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="dataViewModal" role="dialog" aria-modal="true" aria-labelledby="dataViewModalTitle">
    <div class="modal data-view-modal">
      <div class="modal-header">
        <h2 id="dataViewModalTitle">데이터 보기</h2>
        <button type="button" class="modal-close" id="btnDataViewModalClose" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body" style="display: flex; flex-direction: column; min-height: 0; flex: 1">
        <p class="data-view-hint" id="dataViewModalInfo">
          열 체크 후 복사하거나, 드래그·Ctrl+C, 전체 복사로 엑셀에 붙여넣을 수 있습니다.
        </p>
        <div class="data-view-toolbar">
          <button type="button" class="btn btn-primary" id="btnDataViewCopy">복사</button>
          <button type="button" class="btn" id="btnDataViewCopyAll">전체 복사 (TSV)</button>
        </div>
        <div class="data-view-scroll" id="dataViewScroll">
          <table class="data-view-table" id="dataViewTable">
            <thead id="dataViewHead"></thead>
            <tbody id="dataViewBody"></tbody>
          </table>
        </div>
        <p class="modal-status" id="dataViewModalStatus"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" id="btnDataViewModalCancel">닫기</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="categoryBulkModal" role="dialog" aria-modal="true" aria-labelledby="categoryBulkModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h2 id="categoryBulkModalTitle">분류 변경</h2>
        <button type="button" class="modal-close" id="btnCategoryBulkModalClose" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body">
        <p class="category-bulk-info" id="categoryBulkModalInfo"></p>
        <div class="category-bulk-buttons" id="categoryBulkButtons" aria-label="분류 선택"></div>
        <p class="modal-status" id="categoryBulkModalStatus"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" id="btnCategoryBulkModalCancel">닫기</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="tagModal" role="dialog" aria-modal="true" aria-labelledby="tagModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h2 id="tagModalTitle">태그 편집</h2>
        <button type="button" class="modal-close" id="btnTagModalClose" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body">
        <p class="tag-modal-info" id="tagModalInfo"></p>
        <div id="tagChipList" class="tag-chip-list empty-hint">태그 없음</div>
        <div class="tag-add-row">
          <input type="text" id="tagInput" placeholder="새 태그 입력" autocomplete="off" />
          <button type="button" class="btn" id="btnTagChipAdd">추가</button>
        </div>
        <p class="modal-status" id="tagModalStatus"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" id="btnTagModalCancel">취소</button>
        <button type="button" class="btn btn-primary" id="btnTagModalSave">완료</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="uploadResultModal" role="dialog" aria-modal="true" aria-labelledby="uploadResultModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h2 id="uploadResultModalTitle">업로드 완료</h2>
        <button type="button" class="modal-close" id="btnUploadResultClose" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body">
        <p class="upload-result-summary" id="uploadResultSummary"></p>
        <ul class="upload-result-category-list" id="uploadResultCategoryList" aria-label="분류별 추가 건수"></ul>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="btnUploadResultOk">확인</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="uploadModal" role="dialog" aria-modal="true" aria-labelledby="uploadModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h2 id="uploadModalTitle">데이터 추가</h2>
        <button type="button" class="modal-close" id="btnModalClose" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body">
        <div class="drop-zone" id="dropZone" role="button" tabindex="0" aria-label="엑셀 파일 드래그 앤 드롭 또는 클릭하여 선택">
          <span>엑셀을 <strong>끌어다 놓기</strong> 또는 클릭</span>
          <span class="file-name" id="dropZoneFileName" hidden></span>
          <span style="font-size: 0.78rem">.xlsx · .xls · .csv</span>
        </div>
        <input type="file" id="fileInput" class="file-input-hidden" accept=".xlsx,.xls,.csv" />
        <label class="check">
          <input type="checkbox" id="replaceOnUpload" />
          업로드 시 기존 데이터 전체 삭제 후 등록
        </label>
        <p class="modal-status" id="modalStatus"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" id="btnModalCancel">취소</button>
        <button type="button" class="btn btn-primary" id="btnUpload">업로드</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
