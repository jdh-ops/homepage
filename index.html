<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>포션 정리</title>
<meta name="description" content="섞인 물약을 병마다 한 색씩 정리하는 퍼즐 게임" />
<style>
  :root {
    --bg1: #1b1530;
    --bg2: #0e0b1a;
    --panel: rgba(255, 255, 255, 0.06);
    --line: rgba(255, 255, 255, 0.14);
    --text: #f2eefc;
    --muted: #a9a1c4;
    --accent: #b78bff;
    --bw: 54px;   /* 병 너비 (JS가 화면 크기에 맞춰 조정) */
    --bh: 180px;  /* 병 높이 */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 0%, var(--bg1), var(--bg2) 70%) fixed;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100dvh;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  header {
    width: 100%;
    max-width: 720px;
    padding: 18px 16px 6px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  h1 { margin: 0; font-size: 22px; letter-spacing: 0.02em; }
  h1 span { color: var(--accent); }
  .stats { color: var(--muted); font-size: 14px; display: flex; gap: 14px; font-variant-numeric: tabular-nums; }
  .stats b { color: var(--text); font-weight: 600; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 8px 16px 0;
  }
  .btn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 14px;
    padding: 9px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s, transform 0.1s;
  }
  .btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); }
  .btn:active:not(:disabled) { transform: scale(0.96); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn.primary { background: var(--accent); border-color: transparent; color: #1a1030; font-weight: 700; }

  main {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px 40px;
  }
  #board {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    column-gap: var(--gap, 18px);
    row-gap: 46px;
    padding-top: 30px;
  }

  /* ---------- 병 ---------- */
  .bottle {
    position: relative;
    width: var(--bw);
    height: var(--bh);
    cursor: pointer;
    transition: transform 0.18s ease;
    will-change: transform;
  }
  .bottle.selected { transform: translateY(-18px); }
  .bottle.pouring { z-index: 10; }
  .neck {
    position: absolute;
    left: 50%;
    top: -4px;
    width: 72%;
    height: 10px;
    transform: translateX(-50%);
    border: 3px solid rgba(255, 255, 255, 0.55);
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.04);
    z-index: 2;
  }
  .glass {
    position: absolute;
    inset: 4px 0 0 0;
    border: 3px solid rgba(255, 255, 255, 0.55);
    border-top: none;
    border-radius: 6px 6px calc(var(--bw) / 2) calc(var(--bw) / 2);
    background: rgba(255, 255, 255, 0.05);
    overflow: hidden;
    display: flex;
    flex-direction: column-reverse;
    padding: 0 0 0;
  }
  .glass::after { /* 유리 반사광 */
    content: "";
    position: absolute;
    left: 14%;
    top: 8%;
    width: 12%;
    height: 70%;
    border-radius: 99px;
    background: linear-gradient(rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0));
    pointer-events: none;
  }
  .layer {
    /* 위쪽 여유 공간 확보: 4칸이 병 높이의 88% */
    height: 22%;
    flex: none;
    background: var(--c);
    background-image: linear-gradient(90deg, rgba(0, 0, 0, 0.12), rgba(255, 255, 255, 0.12) 45%, rgba(0, 0, 0, 0.18));
    transform-origin: bottom;
  }
  .layer.fill { animation: fill 0.35s ease-out both; }
  @keyframes fill { from { transform: scaleY(0); } to { transform: scaleY(1); } }

  .cork {
    position: absolute;
    left: 50%;
    top: -16px;
    width: 52%;
    height: 18px;
    transform: translateX(-50%) scale(0);
    border-radius: 5px 5px 3px 3px;
    background: linear-gradient(#c99a62, #8d6238);
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.2);
    z-index: 3;
    transition: transform 0.3s cubic-bezier(0.3, 1.6, 0.5, 1);
  }
  .bottle.done .cork { transform: translateX(-50%) scale(1); }
  .bottle.done .glass { box-shadow: 0 0 22px -4px var(--glow, transparent); }
  .bottle.hint-from { animation: hintFrom 0.5s ease-in-out 3; }
  .bottle.hint-to .glass { animation: hintTo 0.5s ease-in-out 3; }
  @keyframes hintFrom { 50% { transform: translateY(-14px); } }
  @keyframes hintTo { 50% { border-color: #fff; box-shadow: 0 0 18px rgba(255, 255, 255, 0.6); } }
  .bottle.shake { animation: shake 0.3s; }
  @keyframes shake { 25% { translate: -5px 0; } 75% { translate: 5px 0; } }

  .stream {
    position: fixed;
    width: 6px;
    border-radius: 3px;
    z-index: 20;
    pointer-events: none;
    transform-origin: top;
    animation: stream 0.38s ease-in-out both;
  }
  @keyframes stream {
    0% { transform: scaleY(0); }
    25%, 80% { transform: scaleY(1); opacity: 1; }
    100% { transform: scaleY(1); opacity: 0; }
  }

  /* ---------- 메시지 / 클리어 ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 20px);
    background: rgba(20, 14, 38, 0.95);
    border: 1px solid var(--line);
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    max-width: calc(100% - 32px);
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(8, 5, 18, 0.6);
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 50;
    padding: 16px;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .card {
    background: linear-gradient(#2a2148, #1c1634);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px 30px 24px;
    text-align: center;
    min-width: min(300px, 100%);
    transform: scale(0.9);
    transition: transform 0.3s cubic-bezier(0.3, 1.5, 0.5, 1);
  }
  .overlay.show .card { transform: scale(1); }
  .card h2 { margin: 0 0 6px; font-size: 26px; }
  .card p { margin: 0 0 20px; color: var(--muted); }
  .card .btn { font-size: 16px; padding: 11px 26px; }
  .help { color: var(--muted); font-size: 13px; text-align: center; padding: 0 16px 18px; margin: 0; }
</style>
</head>
<body>
  <header>
    <h1>포션 <span>정리</span></h1>
    <div class="stats">
      <span>레벨 <b id="level">1</b></span>
      <span>이동 <b id="moves">0</b></span>
    </div>
  </header>

  <div class="toolbar">
    <button class="btn" id="btnUndo">↶ 되돌리기</button>
    <button class="btn" id="btnRestart">⟲ 다시</button>
    <button class="btn" id="btnHint">💡 힌트</button>
    <button class="btn" id="btnExtra">＋ 빈 병</button>
  </div>

  <main><div id="board"></div></main>
  <p class="help">병을 눌러 고른 뒤, 부을 병을 누르세요. 맨 위 색이 같거나 빈 병에만 부을 수 있어요.</p>

  <div class="toast" id="toast"></div>

  <div class="overlay" id="winOverlay">
    <div class="card">
      <h2>정리 완료! ✨</h2>
      <p id="winText"></p>
      <button class="btn primary" id="btnNext">다음 레벨</button>
    </div>
  </div>

<script>
(() => {
  "use strict";

  const CAP = 4;
  const COLORS = [
    "#e5484d", // 빨강
    "#3e7bfa", // 파랑
    "#f7d23e", // 노랑
    "#3fb760", // 초록
    "#a160e8", // 보라
    "#f5893a", // 주황
    "#ef78bd", // 분홍
    "#1fc0b3", // 청록
    "#8d5a3b", // 갈색
    "#c9d0dc", // 은색
    "#7cc7ff", // 하늘
    "#1f5f3a", // 숲
  ];
  const STORAGE_KEY = "potion-sort-level";

  const $ = (id) => document.getElementById(id);
  const boardEl = $("board");

  let level = 1;
  let initial = [];   // 레벨 시작 상태
  let state = [];     // 현재 상태: 병 배열, 각 병은 아래→위 색 번호 배열
  let history = [];
  let selected = -1;
  let moves = 0;
  let busy = false;
  let extraUsed = false;
  let bottleEls = [];
  let hintPath = null;   // 힌트로 찾은 해답 경로 (따라가면 다음 힌트도 같은 경로 사용)

  // ---------- 저장 ----------
  function loadLevel() {
    try { return Math.max(1, parseInt(localStorage.getItem(STORAGE_KEY), 10) || 1); }
    catch { return 1; }
  }
  function saveLevel() {
    try { localStorage.setItem(STORAGE_KEY, String(level)); } catch { /* 무시 */ }
  }

  // ---------- 규칙 ----------
  const clone = (s) => s.map((b) => b.slice());
  const top = (b) => b[b.length - 1];
  const uniform = (b) => b.every((c) => c === b[0]);
  const isComplete = (b) => b.length === CAP && uniform(b);

  function topRun(b) {
    let k = 0;
    for (let i = b.length - 1; i >= 0 && b[i] === top(b); i--) k++;
    return k;
  }

  // 부을 수 있는 양 (0이면 불가)
  function pourAmount(s, i, j) {
    if (i === j) return 0;
    const a = s[i], b = s[j];
    if (!a.length || b.length >= CAP) return 0;
    if (b.length && top(b) !== top(a)) return 0;
    return Math.min(topRun(a), CAP - b.length);
  }

  function applyPour(s, i, j, n) {
    for (let k = 0; k < n; k++) s[j].push(s[i].pop());
  }

  const isWon = (s) => s.every((b) => b.length === 0 || isComplete(b));

  // ---------- 풀이기 (생성 검증 + 힌트) ----------
  // 해답 경로 [[from,to],...] / 해답 없음 null / 탐색 한도 초과 undefined
  function solve(start, limit = 120000) {
    const seen = new Set();
    const path = [];
    let nodes = 0;
    const key = (s) => s.map((b) => b.join(",")).sort().join("|");

    function dfs(s) {
      if (isWon(s)) return true;
      if (++nodes > limit) return false;
      const k = key(s);
      if (seen.has(k)) return false;
      seen.add(k);

      const cand = [];
      for (let i = 0; i < s.length; i++) {
        const a = s[i];
        if (!a.length || isComplete(a)) continue;
        let triedEmpty = false;
        for (let j = 0; j < s.length; j++) {
          const n = pourAmount(s, i, j);
          if (!n) continue;
          if (!s[j].length) {
            if (uniform(a) || triedEmpty) continue; // 의미 없는 이동 / 빈 병은 하나만 시도
            triedEmpty = true;
            cand.push([i, j, n, 1]);
          } else {
            // 받는 병이 한 색이면 우선
            cand.push([i, j, n, uniform(s[j]) ? -1 : 0]);
          }
        }
      }
      cand.sort((x, y) => x[3] - y[3]);
      for (const [i, j, n] of cand) {
        const ns = clone(s);
        applyPour(ns, i, j, n);
        path.push([i, j]);
        if (dfs(ns)) return true;
        path.pop();
        if (nodes > limit) return false;
      }
      return false;
    }

    if (dfs(clone(start))) return path;
    return nodes > limit ? undefined : null;
  }

  // ---------- 레벨 생성 ----------
  function mulberry32(a) {
    return () => {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function colorsFor(lv) {
    return Math.min(COLORS.length, 3 + Math.floor((lv - 1) / 2));
  }

  function generate(lv) {
    const nColors = colorsFor(lv);
    const empties = 2;
    for (let attempt = 0; ; attempt++) {
      const rand = mulberry32(lv * 7919 + attempt * 104729);
      // 이번 레벨에 쓸 색 고르기
      const palette = [...COLORS.keys()];
      for (let i = palette.length - 1; i > 0; i--) {
        const r = Math.floor(rand() * (i + 1));
        [palette[i], palette[r]] = [palette[r], palette[i]];
      }
      const pool = [];
      for (let c = 0; c < nColors; c++) for (let k = 0; k < CAP; k++) pool.push(palette[c]);
      for (let i = pool.length - 1; i > 0; i--) {
        const r = Math.floor(rand() * (i + 1));
        [pool[i], pool[r]] = [pool[r], pool[i]];
      }
      const s = [];
      for (let b = 0; b < nColors; b++) s.push(pool.slice(b * CAP, b * CAP + CAP));
      for (let e = 0; e < empties; e++) s.push([]);

      // 너무 쉬운 배치(이미 완성된 병) 피하기, 풀 수 있는지 확인
      if (s.some(isComplete)) continue;
      if (solve(s)) return s;
    }
  }

  // ---------- 화면 ----------
  function layout() {
    const n = state.length;
    const perRow = n <= 7 ? n : Math.ceil(n / 2);
    const vw = Math.min(window.innerWidth, 760) - 32;
    const gap = vw < 420 ? 10 : 18;
    const bw = Math.max(30, Math.min(58, Math.floor((vw - gap * (perRow - 1)) / perRow)));
    const rows = Math.ceil(n / perRow);
    const availH = window.innerHeight - 260;
    const bh = Math.max(110, Math.min(bw * 3.3, (availH - (rows - 1) * 46) / rows));
    const root = document.documentElement.style;
    root.setProperty("--bw", bw + "px");
    root.setProperty("--bh", bh + "px");
    boardEl.style.setProperty("--gap", gap + "px");
    boardEl.style.maxWidth = perRow * bw + (perRow - 1) * gap + 1 + "px";
  }

  function buildBoard() {
    boardEl.innerHTML = "";
    bottleEls = state.map((_, i) => {
      const el = document.createElement("div");
      el.className = "bottle";
      el.innerHTML = '<div class="cork"></div><div class="neck"></div><div class="glass"></div>';
      el.addEventListener("click", () => onBottle(i));
      boardEl.appendChild(el);
      return el;
    });
    layout();
    render();
  }

  // filled: {j, from} 이면 j번 병의 from 이후 층에 채우기 애니메이션
  function render(filled) {
    state.forEach((b, i) => {
      const el = bottleEls[i];
      const glass = el.querySelector(".glass");
      glass.innerHTML = "";
      b.forEach((c, k) => {
        const layer = document.createElement("div");
        layer.className = "layer";
        layer.style.setProperty("--c", COLORS[c]);
        if (filled && filled.j === i && k >= filled.from) {
          layer.classList.add("fill");
          layer.style.animationDelay = (k - filled.from) * 0.08 + "s";
        }
        glass.appendChild(layer);
      });
      const done = isComplete(b);
      el.classList.toggle("done", done);
      if (done) el.style.setProperty("--glow", COLORS[b[0]]);
      el.classList.toggle("selected", i === selected);
    });
    $("level").textContent = level;
    $("moves").textContent = moves;
    $("btnUndo").disabled = !history.length;
    $("btnExtra").disabled = extraUsed;
  }

  let toastTimer = 0;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
  }

  function clearHints() {
    bottleEls.forEach((el) => el.classList.remove("hint-from", "hint-to"));
  }

  function shake(el) {
    el.classList.remove("shake");
    void el.offsetWidth;
    el.classList.add("shake");
  }

  // ---------- 조작 ----------
  function onBottle(i) {
    if (busy) return;
    clearHints();
    if (selected === -1) {
      if (!state[i].length || isComplete(state[i])) { shake(bottleEls[i]); return; }
      selected = i;
      render();
      return;
    }
    if (selected === i) { selected = -1; render(); return; }

    const n = pourAmount(state, selected, i);
    if (!n) {
      // 다른 병으로 선택을 옮기기
      shake(bottleEls[i]);
      if (state[i].length && !isComplete(state[i])) selected = i;
      else selected = -1;
      render();
      return;
    }
    pour(selected, i, n);
  }

  async function pour(i, j, n) {
    busy = true;
    const src = bottleEls[i], dst = bottleEls[j];
    const color = COLORS[top(state[i])];
    src.classList.remove("selected");
    src.classList.add("pouring");

    const sr = src.getBoundingClientRect();
    const tr = dst.getBoundingClientRect();
    const h = sr.height;
    const dir = tr.left + tr.width / 2 >= sr.left + sr.width / 2 ? 1 : -1;
    const angle = 72 * dir;
    const rad = (Math.abs(angle) * Math.PI) / 180;
    // 회전 후 병 입구가 대상 병 입구 바로 위에 오도록 위치 계산
    const mouthX = tr.left + tr.width / 2;
    const mouthY = tr.top - 14;
    const cx = mouthX - dir * (h / 2) * Math.sin(rad);
    const cy = mouthY + (h / 2) * Math.cos(rad);
    const dx = cx - (sr.left + sr.width / 2);
    const dy = cy - (sr.top + sr.height / 2);

    const out = src.animate(
      [
        { transform: "translateY(-18px)" },
        { transform: `translate(${dx}px, ${dy}px) rotate(${angle}deg)` },
      ],
      { duration: 300, easing: "ease-in-out", fill: "forwards" }
    );
    await out.finished;

    // 물줄기
    const stream = document.createElement("div");
    stream.className = "stream";
    stream.style.background = color;
    stream.style.left = mouthX - 3 + "px";
    stream.style.top = mouthY + "px";
    const fillTop = tr.bottom - (state[j].length + n) * tr.height * 0.22;
    stream.style.height = Math.max(20, fillTop - mouthY) + "px";
    document.body.appendChild(stream);

    if (hintPath && hintPath[0][0] === i && hintPath[0][1] === j) hintPath.shift();
    else hintPath = null;
    history.push(clone(state));
    const from = state[j].length;
    applyPour(state, i, j, n);
    moves++;
    selected = -1;
    render({ j, from });

    await new Promise((r) => setTimeout(r, 380));
    stream.remove();

    const back = src.animate(
      [
        { transform: `translate(${dx}px, ${dy}px) rotate(${angle}deg)` },
        { transform: "none" },
      ],
      { duration: 260, easing: "ease-in-out", fill: "forwards" }
    );
    await back.finished;
    out.cancel();
    back.cancel();
    src.classList.remove("pouring");
    busy = false;

    if (isWon(state)) setTimeout(showWin, 250);
  }

  function showWin() {
    $("winText").textContent = `레벨 ${level}을 ${moves}번 만에 정리했어요.`;
    $("winOverlay").classList.add("show");
    $("btnNext").focus();
  }

  function startLevel(lv) {
    level = lv;
    saveLevel();
    initial = generate(level);
    state = clone(initial);
    history = [];
    hintPath = null;
    selected = -1;
    moves = 0;
    extraUsed = false;
    buildBoard();
  }

  $("btnUndo").addEventListener("click", () => {
    if (busy || !history.length) return;
    clearHints();
    hintPath = null;
    const prev = history.pop();
    // 빈 병 추가 이후에도 되돌리기가 되도록 병 개수 맞추기
    while (prev.length < state.length) prev.push([]);
    state = prev;
    moves = Math.max(0, moves - 1);
    selected = -1;
    render();
  });

  $("btnRestart").addEventListener("click", () => {
    if (busy) return;
    clearHints();
    state = clone(initial);
    history = [];
    hintPath = null;
    selected = -1;
    moves = 0;
    extraUsed = false;
    buildBoard();
  });

  $("btnExtra").addEventListener("click", () => {
    if (busy || extraUsed) return;
    extraUsed = true;
    hintPath = null;
    state.push([]);
    selected = -1;
    buildBoard();
    toast("빈 병을 하나 추가했어요 (레벨당 1번)");
  });

  $("btnHint").addEventListener("click", () => {
    if (busy || isWon(state)) return;
    clearHints();
    const path = hintPath && hintPath.length ? hintPath : solve(state, 200000);
    hintPath = path || null;
    if (path && path.length) {
      const [a, b] = path[0];
      selected = -1;
      render();
      bottleEls[a].classList.add("hint-from");
      bottleEls[b].classList.add("hint-to");
    } else if (path === null) {
      toast(extraUsed ? "막혔어요. 되돌리기를 해보세요." : "막혔어요. 되돌리기나 빈 병 추가를 해보세요.");
    } else {
      toast("힌트를 찾지 못했어요. 되돌리기를 해보세요.");
    }
  });

  $("btnNext").addEventListener("click", () => {
    $("winOverlay").classList.remove("show");
    startLevel(level + 1);
  });

  window.addEventListener("resize", () => { if (!busy) layout(); });

  startLevel(loadLevel());
})();
</script>
</body>
</html>
